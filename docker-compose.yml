# docker-compose file for running paperless from the docker container registry.
# This file contains everything paperless needs to run.
# Paperless supports amd64, arm and arm64 hardware.
#
# All compose files of paperless configure paperless in the following way:
#
# - Paperless is (re)started on system boot, if it was running before shutdown.
# - Docker volumes for storing data are managed by Docker.
# - Folders for importing and exporting files are created in the same directory
#   as this file and mounted to the correct folders inside the container.
# - Paperless listens on port 8000.
#
# In addition to that, this docker-compose file adds the following optional
# configurations:
#
# - Instead of SQLite (default), PostgreSQL is used as the database server.
# - Apache Tika and Gotenberg servers are started with paperless and paperless
#   is configured to use these services. These provide support for consuming
#   Office documents (Word, Excel, Power Point and their LibreOffice counter-
#   parts.
#
# To install and update paperless with this file, do the following:
#
# - Copy this file as 'docker-compose.yml' and the files 'docker-compose.env'
#   and '.env' into a folder.
# - Run 'docker-compose pull'.
# - Run 'docker-compose run --rm webserver createsuperuser' to create a user.
# - Run 'docker-compose up -d'.
#
# For more extensive installation and update instructions, refer to the
# documentation.

# Volumes #####################################################################
volumes:
  data:
    # external: true

  # Use this, if using bind mount
  # !! Note: Folder (device) needs to exist on the host! Create if it's not there.
  # data:
  #   driver: local
  #   driver_opts:
  #     type: none
  #     o: bind
  #     device: "${PWD}/data"

  media:
    # external: true

  # Use this, if using bind mount
  # !! Note: Folder (device) needs to exist on the host! Create if it's not there.
  # media:
  #   driver: local
  #   driver_opts:
  #     type: none
  #     o: bind
  #     device: "${PWD}/media"

  # !! Note: Folder (device) needs to exist on the host! Create if it's not there.
  consume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "${PWD}/consume"

  export:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "${PWD}/export"

  pgdata:
  redisdata:
  caddy_data:

# Networks #####################################################################
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    ipam:
      config:
        # Static subnet so Caddy gets a fixed IP for PAPERLESS_TRUSTED_PROXIES.
        # ip_range confines Docker's dynamic pool to .1.0/24, leaving the low
        # addresses (e.g. Caddy's fixed 172.28.0.2) free of collisions.
        - subnet: 172.28.0.0/16
          ip_range: 172.28.1.0/24

# Services #####################################################################
services:
  # Caddy ---------------------------------------------------------------------
  caddy:
    image: caddy:alpine
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    environment:
      TLS_DOMAINS: "${TLS_DOMAINS:?TLS_DOMAINS not set}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:?ADMIN_EMAIL not set}"
      CADDY_TLS: "${CADDY_TLS}"
    networks:
      frontend:
      backend:
        # Fixed IP so paperless can trust it as a proxy (PAPERLESS_TRUSTED_PROXIES).
        ipv4_address: 172.28.0.2
    volumes:
      - caddy_data:/data
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./certs:/certs:ro
    logging:
      options:
        max-size: ${DOCKER_LOGGING_MAX_SIZE:?DOCKER_LOGGING_MAX_SIZE not set}
        max-file: ${DOCKER_LOGGING_MAX_FILE:?DOCKER_LOGGING_MAX_FILE not set}

  # Broker ---------------------------------------------------------------------
  broker:
    image: docker.io/valkey/valkey:${VALKEY_VERSION:?VALKEY_VERSION not set}
    restart: unless-stopped
    volumes:
      - redisdata:/data
    networks:
      - backend
    logging:
      options:
        max-size: ${DOCKER_LOGGING_MAX_SIZE:?DOCKER_LOGGING_MAX_SIZE not set}
        max-file: ${DOCKER_LOGGING_MAX_FILE:?DOCKER_LOGGING_MAX_FILE not set}

  # Postgres ------------------------------------------------------------------
  db:
    image: docker.io/library/postgres:${POSTGRES_VERSION:?POSTGRES_VERSION not set}
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      # postgres:18 changed its default PGDATA to /var/lib/postgresql/18/docker and
      # moved its VOLUME to the parent dir. Pin PGDATA back to the classic path so the
      # existing data volume (mounted at .../data) keeps working instead of being
      # flagged as an "unused mount". Avoids a data relocation on upgrade.
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB not set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER not set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD not set}
    networks:
      - backend
    logging:
      options:
        max-size: ${DOCKER_LOGGING_MAX_SIZE:?DOCKER_LOGGING_MAX_SIZE not set}
        max-file: ${DOCKER_LOGGING_MAX_FILE:?DOCKER_LOGGING_MAX_FILE not set}

  # Paperless -----------------------------------------------------------------
  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:${PAPERLESS_NGX_VERSION:?PAPERLESS_NGX_VERSION not set}
    restart: unless-stopped
    networks:
      - backend
    depends_on:
      - db
      - broker
      - gotenberg
      - tika
    # ports:
    #   - "8000:8000"
    healthcheck:
      test:
        ["CMD", "curl", "-fs", "-S", "--max-time", "2", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - data:/usr/src/paperless/data
      - media:/usr/src/paperless/media
      - export:/usr/src/paperless/export
      - consume:/usr/src/paperless/consume
    env_file: docker-compose.env
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_TRUSTED_PROXIES: 172.28.0.2
      PAPERLESS_DBHOST: db
      PAPERLESS_DBNAME: ${POSTGRES_DB:?POSTGRES_DB not set}
      PAPERLESS_DBUSER: ${POSTGRES_USER:?POSTGRES_USER not set}
      PAPERLESS_DBPASS: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD not set}
      # Secrets injected from the gitignored .env (env_file can't substitute).
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:?PAPERLESS_SECRET_KEY not set}
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD:?PAPERLESS_ADMIN_PASSWORD not set}
      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
      PAPERLESS_URL: ${PAPERLESS_URL:?PAPERLESS_URL not set}
      # --- Paperless AI (v3). Off unless PAPERLESS_AI_ENABLED=true in .env. ---
      PAPERLESS_AI_ENABLED: ${PAPERLESS_AI_ENABLED:-false}
      PAPERLESS_AI_LLM_BACKEND: ${PAPERLESS_AI_LLM_BACKEND:-ollama}
      PAPERLESS_AI_LLM_ENDPOINT: ${PAPERLESS_AI_LLM_ENDPOINT:-}
      PAPERLESS_AI_LLM_MODEL: ${PAPERLESS_AI_LLM_MODEL:-}
      PAPERLESS_AI_LLM_API_KEY: ${PAPERLESS_AI_LLM_API_KEY:-}
      PAPERLESS_AI_LLM_EMBEDDING_BACKEND: ${PAPERLESS_AI_LLM_EMBEDDING_BACKEND:-ollama}
      PAPERLESS_AI_LLM_EMBEDDING_MODEL: ${PAPERLESS_AI_LLM_EMBEDDING_MODEL:-}
      PAPERLESS_AI_LLM_ALLOW_INTERNAL_ENDPOINTS: ${PAPERLESS_AI_LLM_ALLOW_INTERNAL_ENDPOINTS:-false}
      PAPERLESS_AI_LLM_OUTPUT_LANGUAGE: ${PAPERLESS_AI_LLM_OUTPUT_LANGUAGE:-de}
      PAPERLESS_AI_LLM_REQUEST_TIMEOUT: ${PAPERLESS_AI_LLM_REQUEST_TIMEOUT:-300}
    logging:
      options:
        max-size: ${DOCKER_LOGGING_MAX_SIZE:?DOCKER_LOGGING_MAX_SIZE not set}
        max-file: ${DOCKER_LOGGING_MAX_FILE:?DOCKER_LOGGING_MAX_FILE not set}

  # Gotenberg -----------------------------------------------------------------
  gotenberg:
    image: docker.io/gotenberg/gotenberg:${GOTENBERG_VERSION:?GOTENBERG_VERSION not set}
    restart: unless-stopped
    networks:
      - backend
    # The gotenberg chromium route is used to convert .eml files. We do not
    # want to allow external content like tracking pixels or even javascript.
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"
    logging:
      options:
        max-size: ${DOCKER_LOGGING_MAX_SIZE:?DOCKER_LOGGING_MAX_SIZE not set}
        max-file: ${DOCKER_LOGGING_MAX_FILE:?DOCKER_LOGGING_MAX_FILE not set}

  # Tika ----------------------------------------------------------------------
  tika:
    networks:
      - backend
    image: docker.io/apache/tika:${TKKA_VERSION:?TKKA_VERSION not set}
    restart: unless-stopped
    logging:
      options:
        max-size: ${DOCKER_LOGGING_MAX_SIZE:?DOCKER_LOGGING_MAX_SIZE not set}
        max-file: ${DOCKER_LOGGING_MAX_FILE:?DOCKER_LOGGING_MAX_FILE not set}
