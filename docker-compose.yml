# docker-compose file for running paperless from the docker container registry.
# This file contains everything paperless needs to run.
# Paperless supports amd64, arm and arm64 hardware.
#
# All compose files of paperless configure paperless in the following way:
#
# - Paperless is (re)started on system boot, if it was running before shutdown.
# - Docker volumes for storing data are managed by Docker.
# - Folders for importing and exporting files are created in the same directory
#   as this file and mounted to the correct folders inside the container.
# - Paperless listens on port 8000.
#
# In addition to that, this docker-compose file adds the following optional
# configurations:
#
# - Instead of SQLite (default), PostgreSQL is used as the database server.
# - Apache Tika and Gotenberg servers are started with paperless and paperless
#   is configured to use these services. These provide support for consuming
#   Office documents (Word, Excel, Power Point and their LibreOffice counter-
#   parts.
#
# To install and update paperless with this file, do the following:
#
# - Copy this file as 'docker-compose.yml' and the files 'docker-compose.env'
#   and '.env' into a folder.
# - Run 'docker-compose pull'.
# - Run 'docker-compose run --rm webserver createsuperuser' to create a user.
# - Run 'docker-compose up -d'.
#
# For more extensive installation and update instructions, refer to the
# documentation.

# Volumes #####################################################################
volumes:
  data:
    # external: true

  # Use this, if using bind mount
  # !! Note: Folder (device) needs to exist on the host! Create if it's not there.
  # data:
  #   driver: local
  #   driver_opts:
  #     type: none
  #     o: bind
  #     device: "${PWD}/data"

  media:
    # external: true

  # Use this, if using bind mount
  # !! Note: Folder (device) needs to exist on the host! Create if it's not there.
  # media:
  #   driver: local
  #   driver_opts:
  #     type: none
  #     o: bind
  #     device: "${PWD}/media"

  # !! Note: Folder (device) needs to exist on the host! Create if it's not there.
  consume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "${PWD}/consume"

  export:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "${PWD}/export"

  pgdata:
  redisdata:
  caddy_data:

# Networks #####################################################################
networks:
  # Edge network, dual-stack (IPv4 + IPv6 ULA), with internet access. Carries
  # Caddy, the webserver and the published host ports.
  # Static subnets so Caddy gets fixed addresses for PAPERLESS_TRUSTED_PROXIES.
  # ip_range confines Docker's dynamic pool to a sub-range, leaving the low
  # addresses (e.g. Caddy's fixed CADDY_IP / CADDY_IP_V6) free of collisions.
  # All configurable via .env; values must stay mutually consistent
  # (ip_range inside subnet, CADDY_IP inside subnet but outside ip_range).
  frontend:
    driver: bridge
    attachable: false
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: ${FRONTEND_SUBNET:?FRONTEND_SUBNET not set}
          ip_range: ${FRONTEND_IP_RANGE:?FRONTEND_IP_RANGE not set}
        - subnet: ${FRONTEND_SUBNET_V6:?FRONTEND_SUBNET_V6 not set}
          ip_range: ${FRONTEND_IP_RANGE_V6:?FRONTEND_IP_RANGE_V6 not set}

  # Backing services (db, broker, gotenberg, tika), dual-stack but internal:
  # no route off the bridge in either direction. tika and gotenberg parse
  # attacker-supplied documents, so denying them egress removes the callback /
  # stage-2 download / direct exfiltration path after a parser compromise. It
  # also keeps the unauthenticated valkey off the network Caddy sits on.
  # The webserver is deliberately the only member of both networks; no fixed
  # addresses are needed here, so no ip_range either.
  # Measured scope: members get no default route at all. The docker host still
  # has an address on the bridge and can reach them directly — internal is not a
  # host-level firewall.
  backend:
    driver: bridge
    internal: true
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: ${BACKEND_SUBNET:?BACKEND_SUBNET not set}
        - subnet: ${BACKEND_SUBNET_V6:?BACKEND_SUBNET_V6 not set}

# Services #####################################################################
services:
  # Caddy ---------------------------------------------------------------------
  # Bundled reverse proxy (mode A). Gated behind the "local-proxy" profile so it
  # can be disabled for an external proxy (mode B): clear COMPOSE_PROFILES in
  # .env and the webserver's published port takes over. See .env.example.
  caddy:
    image: caddy:alpine
    profiles: ["local-proxy"]
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    environment:
      TLS_DOMAINS: "${TLS_DOMAINS:?TLS_DOMAINS not set}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:?ADMIN_EMAIL not set}"
      CADDY_TLS: "${CADDY_TLS}"
    # Edge network only — Caddy can reach the webserver and nothing else.
    networks:
      frontend:
        # Fixed IPs so paperless can trust it as a proxy (PAPERLESS_TRUSTED_PROXIES).
        ipv4_address: ${CADDY_IP:?CADDY_IP not set}
        ipv6_address: ${CADDY_IP_V6:?CADDY_IP_V6 not set}
    volumes:
      - caddy_data:/data
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./certs:/certs:ro
    logging:
      options:
        max-size: ${DOCKER_LOGGING_MAX_SIZE:?DOCKER_LOGGING_MAX_SIZE not set}
        max-file: ${DOCKER_LOGGING_MAX_FILE:?DOCKER_LOGGING_MAX_FILE not set}

  # Broker ---------------------------------------------------------------------
  broker:
    image: docker.io/valkey/valkey:${VALKEY_VERSION:?VALKEY_VERSION not set}
    restart: unless-stopped
    volumes:
      - redisdata:/data
    networks:
      - backend
    logging:
      options:
        max-size: ${DOCKER_LOGGING_MAX_SIZE:?DOCKER_LOGGING_MAX_SIZE not set}
        max-file: ${DOCKER_LOGGING_MAX_FILE:?DOCKER_LOGGING_MAX_FILE not set}

  # Postgres ------------------------------------------------------------------
  db:
    image: docker.io/library/postgres:${POSTGRES_VERSION:?POSTGRES_VERSION not set}
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      # postgres:18 changed its default PGDATA to /var/lib/postgresql/18/docker and
      # moved its VOLUME to the parent dir. Pin PGDATA back to the classic path so the
      # existing data volume (mounted at .../data) keeps working instead of being
      # flagged as an "unused mount". Avoids a data relocation on upgrade.
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB not set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER not set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD not set}
    networks:
      - backend
    logging:
      options:
        max-size: ${DOCKER_LOGGING_MAX_SIZE:?DOCKER_LOGGING_MAX_SIZE not set}
        max-file: ${DOCKER_LOGGING_MAX_FILE:?DOCKER_LOGGING_MAX_FILE not set}

  # Paperless -----------------------------------------------------------------
  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:${PAPERLESS_NGX_VERSION:?PAPERLESS_NGX_VERSION not set}
    restart: unless-stopped
    # The only service on both networks: it needs egress (mail, AI endpoint) and
    # reaches the backing services on the internal one. frontend is pinned as the
    # primary endpoint so the published port and the default route come from it.
    networks:
      frontend:
        priority: 100
      backend:
        priority: 10
    depends_on:
      - db
      - broker
      - gotenberg
      - tika
    # Published host port. Unused loopback bind in mode A (Caddy reaches the
    # webserver over the frontend network); the ingress for an external proxy in
    # mode B. Override the bind via PAPERLESS_WEBSERVER_BIND in .env.
    # One mapping binds one address of one family, so v4 and v6 need separate
    # entries. Comment out a line to publish on a single stack only.
    ports:
      - "${PAPERLESS_WEBSERVER_BIND:-127.0.0.1:8000}:8000"
      - "${PAPERLESS_WEBSERVER_BIND_V6:-[::1]:8000}:8000"
    healthcheck:
      test:
        ["CMD", "curl", "-fs", "-S", "--max-time", "2", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - data:/usr/src/paperless/data
      - media:/usr/src/paperless/media
      - export:/usr/src/paperless/export
      - consume:/usr/src/paperless/consume
    env_file: docker-compose.env
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBENGINE: ${PAPERLESS_DBENGINE:-postgresql}
      # Mode A: both of Caddy's fixed addresses (CADDY_IP, CADDY_IP_V6) — which one
      # paperless sees depends on the family Caddy dialed the upstream over.
      PAPERLESS_TRUSTED_PROXIES: ${PAPERLESS_TRUSTED_PROXIES:?PAPERLESS_TRUSTED_PROXIES not set}
      # Number of proxy HOPS, not addresses. paperless defaults it to the length of
      # PAPERLESS_TRUSTED_PROXIES, so listing one proxy under two addresses (v4 + v6)
      # makes allauth expect two X-Forwarded-For entries and every login returns 500
      # ("ALLAUTH_TRUSTED_PROXY_COUNT does not match X-Forwarded-For"). Pin it.
      PAPERLESS_ALLAUTH_TRUSTED_PROXY_COUNT: ${PAPERLESS_ALLAUTH_TRUSTED_PROXY_COUNT:-1}
      PAPERLESS_DBHOST: db
      PAPERLESS_DBNAME: ${POSTGRES_DB:?POSTGRES_DB not set}
      PAPERLESS_DBUSER: ${POSTGRES_USER:?POSTGRES_USER not set}
      PAPERLESS_DBPASS: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD not set}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:?PAPERLESS_SECRET_KEY not set}
      PAPERLESS_ADMIN_USER: ${PAPERLESS_ADMIN_USER:-admin}
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD:?PAPERLESS_ADMIN_PASSWORD not set}
      PAPERLESS_ADMIN_MAIL: ${PAPERLESS_ADMIN_MAIL:-admin@example.com}
      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
      PAPERLESS_URL: ${PAPERLESS_URL:?PAPERLESS_URL not set}
      PAPERLESS_AI_ENABLED: ${PAPERLESS_AI_ENABLED:-false}
      PAPERLESS_AI_LLM_BACKEND: ${PAPERLESS_AI_LLM_BACKEND:-ollama}
      PAPERLESS_AI_LLM_ENDPOINT: ${PAPERLESS_AI_LLM_ENDPOINT:-}
      PAPERLESS_AI_LLM_MODEL: ${PAPERLESS_AI_LLM_MODEL:-}
      PAPERLESS_AI_LLM_API_KEY: ${PAPERLESS_AI_LLM_API_KEY:-}
      PAPERLESS_AI_LLM_EMBEDDING_BACKEND: ${PAPERLESS_AI_LLM_EMBEDDING_BACKEND:-ollama}
      PAPERLESS_AI_LLM_EMBEDDING_MODEL: ${PAPERLESS_AI_LLM_EMBEDDING_MODEL:-}
      PAPERLESS_AI_LLM_ALLOW_INTERNAL_ENDPOINTS: ${PAPERLESS_AI_LLM_ALLOW_INTERNAL_ENDPOINTS:-false}
      PAPERLESS_AI_LLM_OUTPUT_LANGUAGE: ${PAPERLESS_AI_LLM_OUTPUT_LANGUAGE:-de}
      PAPERLESS_AI_LLM_REQUEST_TIMEOUT: ${PAPERLESS_AI_LLM_REQUEST_TIMEOUT:-300}
    logging:
      options:
        max-size: ${DOCKER_LOGGING_MAX_SIZE:?DOCKER_LOGGING_MAX_SIZE not set}
        max-file: ${DOCKER_LOGGING_MAX_FILE:?DOCKER_LOGGING_MAX_FILE not set}

  # Gotenberg -----------------------------------------------------------------
  gotenberg:
    image: docker.io/gotenberg/gotenberg:${GOTENBERG_VERSION:?GOTENBERG_VERSION not set}
    restart: unless-stopped
    networks:
      - backend
    # The gotenberg chromium route is used to convert .eml files. We do not
    # want to allow external content like tracking pixels or even javascript.
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=^file:///tmp/.*"
    logging:
      options:
        max-size: ${DOCKER_LOGGING_MAX_SIZE:?DOCKER_LOGGING_MAX_SIZE not set}
        max-file: ${DOCKER_LOGGING_MAX_FILE:?DOCKER_LOGGING_MAX_FILE not set}

  # Tika ----------------------------------------------------------------------
  tika:
    networks:
      - backend
    image: docker.io/apache/tika:${TKKA_VERSION:?TKKA_VERSION not set}
    restart: unless-stopped
    logging:
      options:
        max-size: ${DOCKER_LOGGING_MAX_SIZE:?DOCKER_LOGGING_MAX_SIZE not set}
        max-file: ${DOCKER_LOGGING_MAX_FILE:?DOCKER_LOGGING_MAX_FILE not set}
